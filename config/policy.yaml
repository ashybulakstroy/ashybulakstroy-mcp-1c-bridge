version: "1.0.0"
mode: read_only

proxy:
  policy_id: secure-readonly-v1
  default_project_id: ashybulak-demo
  default_agent_id: secure-mcp-1c
  provider_allowlist:
    - local_or_low_cost
    - gpt_compatible
    - approved_secure_provider
  cloud_providers:
    - gpt_compatible
    - approved_secure_provider
  project_token_limits:
    default: 4000
    ashybulak-demo: 3000
  mask_pii_before_cloud: true

output:
  max_rows: 100
  mask_iin_bin: false
  mask_bank_accounts: false
  block_external_urls: true
  redact_credentials: true

forbidden:
  - raw_odata
  - query_entity
  - execute_1c_code
  - direct_sql
  - delete_object
  - post_document
  - unpost_document
  - change_posted_document
  - change_closed_period
  - external_http
  - send_email
  - upload_file
  - disable_audit
  - modify_policy
  - post_document_validated

tools:
  get_server_status:
    risk: L0
    capabilities:
      - read_metadata
    auto_approval: true

